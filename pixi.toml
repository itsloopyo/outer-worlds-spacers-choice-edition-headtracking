[workspace]
name = "outer-worlds-spacers-choice-edition-headtracking"
version = "0.1.0"
description = "Head tracking mod for Outer Worlds: Spacer's Choice Edition (UE 4.27)"
license = "MIT"
license-file = "LICENSE"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
sync = "git submodule update --remote cameraunlock-core"

# No -G: let CMake auto-detect the installed Visual Studio generator. Pinning
# "Visual Studio 17 2022" broke on CI once the windows runner image moved to
# VS 2026 (VS 17 absent); auto-detect picks whatever VS the machine has.
#
# Gated on CMakeFiles/generate.stamp, which CMake writes only once generation has
# COMPLETED. CMakeCache.txt is not that marker: it is written before project()
# finishes and long before FetchContent clones MinHook over the network, so a
# configure that fails at that clone still leaves a cache behind. Testing the
# cache then skips setup forever, and every later build fails against the
# half-configured tree with "MSB1009: Project file does not exist" - a message
# that names neither cause nor cure, and whose only cure is `pixi run clean`.
#
# The stamp rather than the generated solution, because the solution's name is
# the generator's to choose: VS 17 writes .sln and VS 18 writes .slnx, and
# pinning either reintroduces the generator coupling the auto-detect above exists
# to avoid.
setup = { cmd = """
    powershell -NoProfile -Command "if (-not (Test-Path 'build/CMakeFiles/generate.stamp')) { cmake -B build -A x64 } else { Write-Host 'Build directory configured, skipping setup' -ForegroundColor Yellow }"
""" }

build = { cmd = "cmake --build build --config Release", depends-on = ["setup"] }
build-debug = { cmd = "cmake --build build --config Debug", depends-on = ["setup"] }

# Rewrites config/HeadTracking.ini, the committed canonical config and the file
# the mod creates as CameraUnlock.ini, from the table after a change to a row, a
# comment or a default, then rewrites the launcher manifest config descriptor's
# per_game from it where the manifest has one. tow_config_tests fails while the
# two differ.
render-config = { cmd = "build/Release/tow_config_tests.exe --render-config config/HeadTracking.ini && node cameraunlock-core/scripts/encode-seed.mjs", depends-on = ["build"] }

# The behaviour locks, the config conversion's differential test, and core's
# canonical config lint over every file that test migrated (run with node). No
# game and no hooks; the INI suites read files through GetPrivateProfileString,
# so they need Windows.
test = { cmd = "ctest --test-dir build -C Release --output-on-failure", depends-on = ["build"] }

clean = { cmd = """
    powershell -NoProfile -Command "if (Test-Path 'build') { Remove-Item 'build' -Recurse -Force }; Write-Host 'Build artifacts cleaned' -ForegroundColor Green"
""" }

clean-all = { cmd = """
    powershell -NoProfile -Command "foreach ($d in @('build','release')) { if (Test-Path $d) { Remove-Item $d -Recurse -Force } }; Write-Host 'All build artifacts cleaned' -ForegroundColor Green"
""" }

# Bump the vendored Ultimate ASI Loader copy. Manual, with a commit attached -
# nothing depends on it; build, package and release consume whatever is
# committed under vendor/.
update-deps = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/update-deps.ps1" }

# The two release gates core ships. Neither had a task, so neither had ever been
# run from this repo: validate-manifest proves every file the launcher manifest
# names is actually in the ZIP, and validate-notices proves every bundled
# component is attributed.
validate-manifest = "node cameraunlock-core/scripts/validate-manifest.mjs"
validate-notices = "node cameraunlock-core/scripts/validate-notices.mjs"

# core's fleet linter for the layer this repo owns: install-wrapper drift, the
# CONFIG BLOCK pairing, CRLF on the .cmd files, action pins, core-pin age,
# manifest and licence. It had no task, so it had never been run from here.
#
# Not in build.yml yet: it currently fails this repo on a README rule that
# contradicts the README template AGENTS.md mandates, and wiring a knowingly-red
# step is worse than none. Run it by hand until that is settled upstream.
conformance = "powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/conformance.ps1"

# Package the release ZIPs into release/.
#
# Depends on test, so no ZIP is built from a tree whose behaviour locks fail -
# the config conversion's differential test above all, which proves that every
# player's HeadTracking.ini is imported into CameraUnlock.ini as the published
# build read it. That includes the tagged build: core's release-mod.yml runs
# this task and has no test step of its own. release.ps1 still runs the tests once before it stamps
# a version, so a failure normally stops a release before anything mutates.
package = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["test"] }

# Full release workflow: stamp version, changelog, package, commit, tag, push.
# Unattended - `pixi run release minor` is the authorization, there is no prompt.
release = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release.ps1" }

# Build + deploy into the detected game install (dev loop).
deploy = { cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/deploy.ps1", depends-on = ["build"] }

install = { depends-on = ["deploy"] }
uninstall = 'cmd /c scripts\uninstall.cmd'

[dependencies]
# No pixi-managed deps - relies on system CMake + Visual Studio.
